    <script>
      // Función para cargar todos los anuncios
      function loadAllAds() {
        try {
          // Verificar que el script de AdSense esté cargado
          if (typeof window.adsbygoogle !== 'undefined') {
            // Esto carga todos los <ins class="adsbygoogle"> de la página
            (adsbygoogle = window.adsbygoogle || []).push({});
          } else {
            console.warn('AdSense script not loaded yet');
          }
        } catch (e) {
          console.warn('AdSense error:', e);
        }
      }

      // Cargar cuando el DOM esté listo
      if (document.readyState === 'complete') {
        loadAllAds();
      } else {
        window.addEventListener('load', loadAllAds);
      }

      // Cargar después de que React renderice (con retraso)
      setTimeout(loadAllAds, 1500);
    </script>
